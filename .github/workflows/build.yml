# Build AurOS on GitHub Actions, test it under KVM, and publish it.
#
# Why here and not in the development container: that container has no
# KVM and its network refuses Mozilla, Flathub, Microsoft and Google, so
# an image built there has no Firefox and cannot preconfigure Flathub,
# and the QEMU tests crawl. Hosted runners have KVM and an open network,
# and the repository is public, so the minutes are free
# (docs/handoff/SESSION-2026-10-23.md, D6).
#
#   gate      decides whether this push needs a build at all: one of the
#             build inputs changed, or the head commit says [build] or
#             [release]. workflow_dispatch is not an option: it only
#             works for workflows on the default branch.
#   build     the desktop image (build/all, WITHOUT ALLOW_BROWSER_FALLBACK,
#             so the Firefox route is exercised), the staging environment,
#             the image in 90 MiB gzip pieces, and the installer with the
#             piece list of the release it would be published as baked in.
#   tests     tests.yml: the unit-ish suites and the end-to-end QEMU tests
#             under KVM, against this run's artifacts.
#   release   only when the head commit says [release]: GitHub Release
#             v<os_version>-<sha7> (a prerelease unless it also says
#             [latest]), then re-downloaded and checked, and the image
#             fetched back on real Windows by the installer's own WinHTTP.
#
# docs/RELEASE.md has how to trigger each of these and what they prove.
name: build

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.g.outputs.build }}
      release: ${{ steps.g.outputs.release }}
      latest: ${{ steps.g.outputs.latest }}
    steps:
      - id: g
        env:
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          build=false; release=false; latest=false
          case "$MSG" in *'[build]'*) build=true ;; esac
          case "$MSG" in *'[release]'*) build=true; release=true ;; esac
          case "$MSG" in *'[latest]'*) latest=true ;; esac
          # The files this push changed; the push payload does not list them.
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' || true) ;;
            *)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' || true) ;;
          esac
          printf '%s\n' "$files" | sed -n '1,60p'
          if printf '%s\n' "$files" | grep -qE '^(build/|src/|rootfs/|profiles/|themes/|shells/|\.github/workflows/(build|tests)\.yml$)'; then
            build=true
          fi
          { echo "build=$build"; echo "release=$release"; echo "latest=$latest"; } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # One build at a time per branch, and only the newest waiting push
    # gets built: several agents push here, and a queue of hour-long
    # builds of commits nobody will publish helps nobody. A [release]
    # commit gets a group of its own, so a later push cannot replace it.
    concurrency:
      group: build-${{ github.ref }}-${{ needs.gate.outputs.release == 'true' && github.sha || 'head' }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
      image_sha256: ${{ steps.pieces.outputs.image_sha256 }}
      image_bytes: ${{ steps.pieces.outputs.image_bytes }}
      setup_sha256: ${{ steps.installer.outputs.setup_sha256 }}
    env:
      # 90 MiB: under any 100 MB limit, and a dropped connection costs
      # one piece, not the image.
      PIECE_BYTES: 94371840
    steps:
      - uses: actions/checkout@v4

      - name: what this build will be called
        id: id
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          v=$(sed -n 's/^os_version="\{0,1\}\([0-9A-Za-z.+-]*\)"\{0,1\}.*/\1/p' profiles/desktop.profile | head -1)
          [ -n "$v" ] || { echo "no os_version in profiles/desktop.profile"; exit 1; }
          tag="v$v-${GITHUB_SHA:0:7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "BASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" >> "$GITHUB_ENV"
          mkdir -p dist/installer dist/pieces
          echo "tag $tag (os_version $v, commit $GITHUB_SHA, run $GITHUB_RUN_ID)" | tee dist/installer/build-info.txt
          : > dist/installer/timings.txt

      - name: room and tools
        run: |
          T=$(date +%s)
          df -h / /mnt || true
          # The big preinstalled SDKs this build never uses (~20 GB), in
          # the background while apt runs. Swap stays: removing it makes
          # jobs die without a word.
          ( sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
              /usr/local/share/chromium /usr/local/julia* 2>/dev/null; echo removed > /tmp/freed ) &
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              debootstrap squashfs-tools zstd gdisk dosfstools mtools e2fsprogs \
              sbsigntool mingw-w64 gcc libc6-dev make python3 cpio file binutils \
              osslsigncode libxml2-utils pigz
          while [ ! -f /tmp/freed ]; do sleep 2; done
          df -h /
          echo "tools $(( $(date +%s) - T )) s" >> dist/installer/timings.txt

      - name: build/all desktop (forge + mkimage), no browser fallback
        run: |
          T=$(date +%s)
          # NOT ALLOW_BROWSER_FALLBACK: this network reaches Mozilla, so
          # the profile's Firefox must arrive, or the build stops.
          sudo env -u ALLOW_BROWSER_FALLBACK ./build/all desktop --keep=raw
          echo "forge+mkimage $(( $(date +%s) - T )) s" >> dist/installer/timings.txt
          ls -la out out/manifests
          df -h /

      - name: what the image says went wrong while building it
        run: |
          W=work/forge/desktop/rootfs/etc/auros/build-warnings
          if sudo test -f "$W"; then sudo cat "$W" > dist/installer/build-warnings; else : > dist/installer/build-warnings; fi
          echo "--- /etc/auros/build-warnings ($(wc -l < dist/installer/build-warnings) lines)"
          cat dist/installer/build-warnings
          if grep -q '^browser=' dist/installer/build-warnings; then
            echo "::warning::the image records a browser problem: $(grep '^browser=' dist/installer/build-warnings)"
          fi
          sudo cp out/manifests/desktop.json dist/installer/manifest-desktop.json
          { echo "### build-warnings"; echo '```'; cat dist/installer/build-warnings; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: build/staging
        run: |
          T=$(date +%s)
          sudo ./build/staging desktop
          sudo chown -R "$(id -u):$(id -g)" out
          echo "staging $(( $(date +%s) - T )) s" >> dist/installer/timings.txt

      - name: the image, in gzip pieces, with the list the installer bakes in
        id: pieces
        run: |
          T=$(date +%s)
          IMG=out/auros-desktop.img
          sha=$(sha256sum "$IMG" | cut -d' ' -f1)
          bytes=$(stat -c %s "$IMG")
          # The same digest build/all recorded, or something touched the
          # image between the two.
          grep -q "\"image_sha256\": \"$sha\"" dist/installer/manifest-desktop.json \
            || { echo "the image does not hash to what build/all recorded"; exit 1; }
          # gzip -9, as every published image so far: the installer's
          # own inflater (src/aurbridge/inflate.c) is what reads it.
          gzip -9 -c "$IMG" > dist/auros-desktop.img.gz
          gzsha=$(sha256sum dist/auros-desktop.img.gz | cut -d' ' -f1)
          ( cd dist/pieces && split -b "$PIECE_BYTES" -d -a 3 ../auros-desktop.img.gz auros-desktop.img.gz. )
          rm -f dist/auros-desktop.img.gz
          {
            echo "# AurOS desktop $TAG, commit ${GITHUB_SHA:0:12}, Actions run $GITHUB_RUN_ID"
            echo "base $BASE_URL"
            for p in dist/pieces/auros-desktop.img.gz.*; do
              echo "piece $(basename "$p") $(stat -c %s "$p") $(sha256sum "$p" | cut -d' ' -f1)"
            done
          } > dist/pieces/pieces.txt
          cat dist/pieces/pieces.txt
          echo "$sha" > dist/pieces/image.sha256
          echo "$bytes" > dist/pieces/image.bytes
          echo "$gzsha" > dist/pieces/image.gz.sha256
          echo "image_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "image_bytes=$bytes" >> "$GITHUB_OUTPUT"
          n=$(grep -c '^piece ' dist/pieces/pieces.txt)
          dl=$(du -cb dist/pieces/auros-desktop.img.gz.* | tail -1 | cut -f1)
          echo "image $bytes bytes, sha256 $sha; gzip $dl bytes (sha256 $gzsha) in $n pieces" | tee -a dist/installer/build-info.txt
          echo "pieces $(( $(date +%s) - T )) s" >> dist/installer/timings.txt

      - name: build/aurbridge, pointed at this release
        id: installer
        run: |
          T=$(date +%s)
          export AUROS_IMAGE_PIECES="$PWD/dist/pieces/pieces.txt"
          export AUROS_IMAGE_SHA256=$(cat dist/pieces/image.sha256)
          export AUROS_IMAGE_BYTES=$(cat dist/pieces/image.bytes)
          # A release build: it refuses an installer that carries no
          # staging environment, no signed shim, or no image address.
          # Unsigned by the owner's decision (docs/SIGNING.md).
          AUROS_RELEASE=1 sh build/aurbridge
          cp out/aurbridge-wizard.exe dist/installer/AurOS-Setup.exe
          cp out/aurbridge.exe out/aurbridge-wizard.exe out/aurbridge-sim dist/installer/
          cp out/auros-staging.img out/auros-staging-vmlinuz out/auros-staging-*.efi dist/installer/
          cp dist/pieces/pieces.txt dist/pieces/image.sha256 dist/pieces/image.bytes dist/installer/
          s=$(sha256sum dist/installer/AurOS-Setup.exe | cut -d' ' -f1)
          echo "setup_sha256=$s" >> "$GITHUB_OUTPUT"
          echo "AurOS-Setup.exe $(stat -c %s dist/installer/AurOS-Setup.exe) bytes, sha256 $s" | tee -a dist/installer/build-info.txt
          echo "aurbridge $(( $(date +%s) - T )) s" >> dist/installer/timings.txt

      - name: what the installer carries, asked of the file itself
        run: |
          # The release build's gates, asked again of the .exe rather
          # than of the script that made it (docs/HANDOFF-RUNBOOK.md).
          python3 tools/pe_payload.py list dist/installer/AurOS-Setup.exe | tee /tmp/res.txt
          for id in 1 2 3 4 5; do
            grep -q "^$id " /tmp/res.txt || { echo "resource $id is missing"; exit 1; }
          done
          n=$(strings dist/installer/AurOS-Setup.exe | grep -c "releases/download/$TAG/" || true)
          [ "$n" -ge 1 ] || { echo "the release's address is not baked into the installer"; exit 1; }
          strings dist/installer/AurOS-Setup.exe | grep -q 'Microsoft Corporation UEFI CA' \
            || { echo "the installer does not know which Microsoft key the shim is signed with"; exit 1; }
          sh tools/manifesttest.sh dist/installer/AurOS-Setup.exe
          out/aurbridge-sim gzselftest
          out/aurbridge-sim sbselftest

      - name: the pieces, put back together by the installer's own code
        run: |
          T=$(date +%s)
          # The simulation links the same phases.c and inflate.c as the
          # Windows installer; served from here, it fetches every piece
          # over HTTP with Range, checks each, unpacks and checks the image.
          ( cd dist/pieces && exec python3 -m http.server 8731 --bind 127.0.0.1 ) > /tmp/http.log 2>&1 &
          sleep 1
          sed "s|^base .*|base http://127.0.0.1:8731/|" dist/pieces/pieces.txt > /tmp/local-pieces.txt
          out/aurbridge-sim getimage /tmp/local-pieces.txt "$RUNNER_TEMP/back.img" \
              "$(cat dist/pieces/image.sha256)" "$(cat dist/pieces/image.bytes)" | tee /tmp/getimage.log
          grep -q 'verdict=ok' /tmp/getimage.log
          rm -f "$RUNNER_TEMP/back.img"
          kill %1 2>/dev/null || true
          echo "getimage-local $(( $(date +%s) - T )) s" >> dist/installer/timings.txt

      - name: the forged rootfs, for the tests that take tools out of it
        run: |
          T=$(date +%s)
          sudo tar -C work/forge/desktop --numeric-owner -cf - rootfs | zstd -T0 -3 -q > dist/rootfs.tar.zst
          ls -la dist/rootfs.tar.zst
          echo "rootfs-tar $(( $(date +%s) - T )) s" >> dist/installer/timings.txt
          echo "build-total $(( $(date +%s) - T0 )) s" >> dist/installer/timings.txt
          cat dist/installer/timings.txt
          { echo "### $TAG"; echo '```'; cat dist/installer/build-info.txt; echo; cat dist/installer/timings.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: auros-installer
          path: dist/installer/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: auros-pieces
          path: dist/pieces/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: auros-rootfs
          path: dist/rootfs.tar.zst
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  tests:
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      run-id: ${{ github.run_id }}

  release:
    needs: [gate, build, tests]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: auros-installer, path: dist/installer }
      - uses: actions/download-artifact@v4
        with: { name: auros-pieces, path: dist/pieces }
      - name: the files, and what was tested where
        env:
          LATEST: ${{ needs.gate.outputs.latest }}
        run: |
          mkdir -p rel
          cp dist/installer/AurOS-Setup.exe dist/pieces/pieces.txt dist/pieces/auros-desktop.img.gz.* rel/
          ( cd rel && sha256sum AurOS-Setup.exe pieces.txt auros-desktop.img.gz.* > SHA256SUMS )
          img=$(cat dist/pieces/image.sha256); bytes=$(cat dist/pieces/image.bytes)
          dl=$(du -cb rel/auros-desktop.img.gz.* | tail -1 | cut -f1)
          n=$(ls rel/auros-desktop.img.gz.* | wc -l)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "AurOS desktop $TAG, built from \`$GITHUB_SHA\` by [Actions run $GITHUB_RUN_ID]($run)."
            echo
            echo "AurOS-Setup.exe is unsigned, by design. Windows asks twice before it starts it: in Edge, *Keep* and then *Keep anyway*; on the blue SmartScreen panel, *More info* and then *Run anyway*. On a PC with Smart App Control on, that has to be switched off first."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Installer | \`AurOS-Setup.exe\`, $(stat -c %s rel/AurOS-Setup.exe) bytes, SHA-256 \`$(sha256sum rel/AurOS-Setup.exe | cut -d' ' -f1)\` |"
            echo "| Image | $bytes bytes, SHA-256 \`$img\` |"
            echo "| Download | $dl bytes of gzip in $n pieces of 90 MiB (\`pieces.txt\`); the installer fetches, checks and resumes them |"
            echo
            echo "**What was tested, and where** (all in [run $GITHUB_RUN_ID]($run)):"
            echo
            echo "- Built on GitHub's ubuntu-24.04 runner: \`build/all desktop\` without \`ALLOW_BROWSER_FALLBACK\`, \`build/staging\`, \`build/aurbridge\`."
            echo "- The pieces were put back together and checked by the installer's own phase engine and inflater (\`aurbridge-sim getimage\`), and the installer's manifest by \`tools/manifesttest.sh\`."
            echo "- Unit suites on Linux: aurfirsttest, choicestest, nvramtest, bridgetest, manifesttest, signtest, Ferry's suite, and \`aurbridge.exe selftest\` under Wine."
            echo "- End to end under QEMU/KVM with OVMF (Microsoft's keys and Secure Boot on where the test asks for it): installtest, nosticktest, firstboottest, choicesboottest, putbacktest."
            echo "- After publishing: \`AurOS-Setup.exe\` re-downloaded from this release and compared; every piece fetched through GitHub's redirect and checked, with a \`Range\` request answered 206; and on a real Windows Server runner the installer's own WinHTTP code fetched the image from this release and checked it, and the downloaded \`AurOS-Setup.exe\` started and passed its navigation test."
            echo
            echo "**Not tested here:** a real PC's disk being resized and written. See docs/RELEASE.md."
            echo
            echo "What the image recorded while it was built (\`/etc/auros/build-warnings\`):"
            echo '```'
            if [ -s dist/installer/build-warnings ]; then cat dist/installer/build-warnings; else echo "(nothing)"; fi
            echo '```'
          } > notes.md
          cat notes.md
          flags="--prerelease"
          if [ "$LATEST" = true ]; then flags="--latest"; fi
          gh release create "$TAG" --target "$GITHUB_SHA" $flags \
              --title "AurOS $TAG" --notes-file notes.md \
              rel/AurOS-Setup.exe rel/pieces.txt rel/SHA256SUMS rel/auros-desktop.img.gz.*

      - name: what a person downloads is what was built
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir -p back && cd back
          curl -fsSL --retry 5 -o AurOS-Setup.exe "$base/AurOS-Setup.exe"
          curl -fsSL --retry 5 -o pieces.txt "$base/pieces.txt"
          cmp AurOS-Setup.exe ../rel/AurOS-Setup.exe
          cmp pieces.txt ../rel/pieces.txt
          sha256sum AurOS-Setup.exe
          # Every piece through the address baked into the installer,
          # which answers 302 to a signed storage URL.
          base2=$(sed -n 's/^base //p' pieces.txt)
          grep '^piece ' pieces.txt | while read -r _ name bytes sha; do
            got=$(curl -fsSL --retry 5 "$base2$name" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$sha" ] || { echo "$name: $got, wanted $sha"; exit 1; }
            echo "$name ok"
          done
          # And resuming: a Range request on the redirect target is a 206
          # that starts where it was asked to.
          first=$(grep -m1 '^piece ' pieces.txt | cut -d' ' -f2)
          curl -fsSL -r 1000000-1000099 -D hdr.txt -o part.bin "$base2$first"
          grep -i '^HTTP/.* 302' hdr.txt
          grep -i '^HTTP/.* 206' hdr.txt
          grep -i '^content-range: bytes 1000000-1000099/' hdr.txt
          [ "$(stat -c %s part.bin)" = 100 ]
          cmp part.bin <(tail -c +1000001 ../rel/$first | head -c 100)
          echo "redirect followed, Range honoured"

  release-windows:
    needs: [build, release]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
      IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
      IMAGE_BYTES: ${{ needs.build.outputs.image_bytes }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: auros-installer, path: exe }
      - name: the published installer, downloaded, starts
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          Invoke-WebRequest -Uri "$base/AurOS-Setup.exe" -OutFile AurOS-Setup.exe
          $h = (Get-FileHash AurOS-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "SHA-256 $h"
          if ($h -ne $env:SETUP_SHA256) { throw "the release's AurOS-Setup.exe is not the one built" }
          "Authenticode (unsigned by design): $((Get-AuthenticodeSignature .\AurOS-Setup.exe).Status)"
          $exe = (Resolve-Path .\AurOS-Setup.exe).Path
          $d = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pub"
          $p = Start-Process -FilePath $exe -ArgumentList '--navtest', $d.FullName -Wait -PassThru
          Get-Content "$d\navtest.log"
          if ($p.ExitCode -ne 0) { throw "--navtest exited $($p.ExitCode)" }
          if (Select-String -Path "$d\navtest.log" -Pattern '\[FAIL\]' -Quiet) { throw "navtest has FAIL lines" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the wizard exited on its own, code $($p.ExitCode)" }
          $p.Kill()
          "the published installer was running after 8 seconds"
      - name: WinHTTP fetches the image from the release, through the redirect
        shell: pwsh
        run: |
          $list = "$env:RUNNER_TEMP\pieces.txt"
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/pieces.txt" -OutFile $list
          $out = "$env:RUNNER_TEMP\auros-desktop.img"
          .\exe\aurbridge.exe getimage $list $out $env:IMAGE_SHA256 $env:IMAGE_BYTES | Tee-Object -FilePath getimage.log
          if ($LASTEXITCODE -ne 0) { throw "getimage exited $LASTEXITCODE" }
          if (-not (Select-String -Path getimage.log -Pattern 'verdict=ok' -Quiet)) { throw "no verdict=ok" }
