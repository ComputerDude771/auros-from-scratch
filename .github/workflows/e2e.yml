# AurOS end to end, on a real Windows, in a VM (tools/e2e/README.md).
#
# windows.yml starts the installer on a GitHub Windows runner, but that
# machine cannot restart into the installer's second half. This runs a
# real Windows 11 (Microsoft's evaluation ISO, installed unattended) in
# QEMU/KVM on a Linux runner, with UEFI Secure Boot and Microsoft's keys,
# a TPM 2.0 and an SSD, and does what a person does: the website in
# Edge, the download, Windows' warnings, the wizard, the restart, the
# staging screen, AurOS's first start, a program from the store. Every
# press goes through the VM's keyboard and tablet; every screen is
# kept. The evidence is attached to a prerelease named e2e-<run id>.
#
# It takes hours, so it runs only when this harness changes or the head
# commit says [e2e]. The installed Windows is cached (key below), so
# later runs skip Setup.
name: e2e

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

env:
  # What a person downloads. INSTALLER_SHA256 empty = accept and print.
  # To test a fresh build instead, set INSTALLER_PATH to the file on the
  # runner (an artifact from an earlier job); the website's links are
  # then pointed at it, served from the runner.
  INSTALLER_URL: https://github.com/ComputerDude771/auros-from-scratch/raw/image-desktop/AurOS-Installer-test.exe
  INSTALLER_SHA256: ef903efd9cdeb10e15e52b3ce9e4eac83788f3396ac9f029ed04f2cfca1c5891
  INSTALLER_PATH: ''
  WEBSITE_DIR: website
  # Windows: Microsoft's evaluation-center link; pinned hash once known.
  WINDOWS_ISO_URL: ''
  WINDOWS_ISO_SHA256: ''
  # Bump to throw the cached Windows away.
  GOLDEN_VERSION: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=false
          case "$MSG" in *'[e2e]'*) run=true ;; esac
          # the files this push changed (the payload does not list them)
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' || true) ;;
            *)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' || true) ;;
          esac
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^(tools/e2e/|\.github/workflows/e2e\.yml$)'; then
            run=true
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # One machine at a time per branch. On the job, not the workflow: every
    # push runs the gate, and a workflow-wide group let a push that changes
    # nothing here cancel a run that was waiting.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: runner (disk, KVM, packages)
        run: |
          echo "E2E_T0=$(date +%s)" >> "$GITHUB_ENV"
          bash tools/e2e/runner-setup.sh | tee -a "$GITHUB_ENV"

      - name: the evidence's prerelease, refreshed while the run goes on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/e2e/publish.sh init
          mkdir -p "$E2E_DIR/out"
          nohup bash tools/e2e/publish.sh live "$E2E_DIR/out" >/dev/null 2>&1 &

      - name: cache key for the installed Windows
        id: key
        run: |
          h=$(cat tools/e2e/guest/autounattend.xml tools/e2e/guest/specialize.cmd \
                  tools/e2e/guest/firstlogon.ps1 tools/e2e/guest/boot.ps1 \
                  tools/e2e/guest/boot.vbs | sha256sum | cut -c1-16)
          echo "key=e2e-windows-v$GOLDEN_VERSION-$h" | tee -a "$GITHUB_OUTPUT"

      - name: the installed Windows, from the cache
        id: golden
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.E2E_DIR }}/golden
          key: ${{ steps.key.outputs.key }}

      - name: M1 - Windows from Microsoft's ISO, unattended, to the desktop
        if: steps.golden.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          sh tools/e2e/get-windows.sh "$E2E_DIR/win.iso"
          sh tools/e2e/mkanswer.sh "$E2E_DIR/answer.iso"
          /usr/bin/python3 tools/e2e/e2e.py windows "$E2E_DIR/out/windows" "$E2E_DIR/golden" \
              --iso "$E2E_DIR/win.iso" --answer "$E2E_DIR/answer.iso"
          rm -f "$E2E_DIR/win.iso"
          ls -la "$E2E_DIR/golden"; du -sh "$E2E_DIR/golden"; df -h "$E2E_DIR"

      - name: keep the installed Windows for the next run
        if: steps.golden.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.E2E_DIR }}/golden
          key: ${{ steps.key.outputs.key }}

      - name: M2/M3 - website, download, wizard, restart, AurOS, the store
        id: flow
        run: |
          [ -z "$INSTALLER_PATH" ] || INSTALLER_PATH=$(realpath "$INSTALLER_PATH")
          [ "$WEBSITE_DIR" = none ] || WEBSITE_DIR=$(realpath "$WEBSITE_DIR")
          # what is left of the job's 355 minutes, less time to publish
          export INSTALLER_PATH WEBSITE_DIR E2E_MINUTES=$(( 330 - ($(date +%s) - E2E_T0) / 60 ))
          /usr/bin/python3 tools/e2e/e2e.py flow "$E2E_DIR/out/flow" "$E2E_DIR/golden" "$E2E_DIR/work"

      - name: M3 - the program is on AurOS's disk (machine off)
        if: steps.flow.outcome == 'success'
        run: /usr/bin/python3 tools/e2e/e2e.py inspect "$E2E_DIR/out/inspect" "$E2E_DIR/work"

      - name: publish the evidence (prerelease e2e-${{ github.run_id }})
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/e2e/publish.sh final "$E2E_DIR/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: ${{ env.E2E_DIR }}/out/e2e-evidence.zip
          if-no-files-found: ignore
