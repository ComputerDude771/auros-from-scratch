# What the machine does when she presses or closes something.
#
# systemd's own defaults are almost all of this already. They are
# written down here anyway, for two reasons: the answers depend on
# systemd's version, and on a machine whose desktop is a service rather
# than a logged-in session they used to not apply at all -- there was
# no session for logind to attach them to until aurshell started asking
# PAM for one.
[Login]
# The physical power button turns the computer off properly. This is
# the one every recovery instruction in the product tells her to reach
# for, so it had better do something better than cutting the power.
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff

# Closing the lid puts it to sleep, which is what her old laptop did
# and what she will expect. Not when it is plugged into a dock and
# driving another screen, where closing the lid means "I am using the
# big screen now" rather than "I have finished".
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Nothing happens on its own because the machine has been quiet. A
# computer that puts itself to sleep while a person is reading is a
# computer that has interrupted them, and this product's audience is
# more likely to be reading slowly than to have walked away.
IdleAction=ignore
